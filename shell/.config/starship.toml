# Starship minimal configuration
# Clean and simple prompt with directory, git branch, and execution time

format = """
$directory$git_branch$git_status$python$cmd_duration
$character"""

[directory]
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
modified = "~"
untracked = "?"
staged = "+"
ahead = "⇡"
behind = "⇣"

[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"

[python]
format = '[(\($virtualenv\))]($style) '
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
